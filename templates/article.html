<article class="article-shell reading-article$security_class">
    <header class="article-header">
        <a class="back-to-blog" href="$back_url">Back to $collection</a>
        <p class="article-eyebrow">$category$type_label</p>
        <h1>$title</h1>
        <p class="article-deck">$summary</p>
        <div class="article-byline">
            <span>By $author</span>
$publication
$updated
            <span>$reading_time</span>
        </div>
    </header>
$standalone_cover
    <div class="reading-layout$layout_class">
        <div class="reading-main-column">
$cover
$toc
            <div class="reading-column">
                <div class="article-body">
$facts
                    $body
                </div>
                <footer class="reading-footer">
                    <section class="reading-author" aria-label="Author">
                        <p class="reading-label">About the author</p>
                        <p><strong>$author</strong></p>
$author_bio
                    </section>
$topics
$sources
$corrections
                    <div class="reading-share" aria-label="Sharing options">
                        <a class="reading-action" href="$email_link">Share by email</a>
                        <button class="reading-action" type="button" data-copy-article="$canonical" hidden>Copy article link</button>
                        <span role="status" data-share-status></span>
                    </div>
$adjacent
                </footer>
            </div>
        </div>
$sidebar
    </div>
</article>
