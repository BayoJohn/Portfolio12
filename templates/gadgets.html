<div class="newsroom gadgets-hub news-wrap">
    <header class="newsroom-header gadgets-header">
        <h1>GADGETS</h1>
        <p>$intro</p>
    </header>
    <nav class="newsroom-filters gadgets-topics" aria-label="Gadget topics">
        <ul>$topics</ul>
    </nav>
    <div class="gadgets-topic-results">
$topic_results
    </div>
    <div class="gadgets-edition">
        <div class="gadgets-lead" id="latest" tabindex="-1">
$feature
            <section class="gadgets-briefing" aria-labelledby="gadgets-briefing-title">
                <h2 id="gadgets-briefing-title">$briefing_title</h2>
$briefing
            </section>
        </div>
        <nav class="gadgets-section" aria-labelledby="devices-title">
            <h2 id="devices-title">Explore by Device</h2>
            <ul class="gadgets-devices">$devices</ul>
        </nav>
        <section class="gadgets-section" id="reviews" tabindex="-1" aria-labelledby="gadget-reviews-title">
            <h2 id="gadget-reviews-title">Product Reviews</h2>
$reviews
        </section>
        <div class="gadgets-columns">
            <section class="gadgets-section" aria-labelledby="gadget-news-title">
                <h2 id="gadget-news-title">Latest Gadget News</h2>
$news
            </section>
            <aside class="gadgets-section gadgets-guides" id="buying-guides" tabindex="-1" aria-labelledby="buying-guides-title">
                <h2 id="buying-guides-title">Buying Guides</h2>
$guides
            </aside>
        </div>
$comparison
        <section class="gadgets-section" aria-labelledby="hardware-title">
            <h2 id="hardware-title">Hardware Explained</h2>
$hardware
        </section>
    </div>
</div>
