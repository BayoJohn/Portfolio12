<!doctype html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="$description">
    <meta name="theme-color" content="#F7F7F2">
    <title>$title</title>
    $metadata
    <script>
        (function () {
            try {
                var savedTheme = localStorage.getItem('theme');
                if (savedTheme === 'dark') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    document.querySelector('meta[name="theme-color"]').setAttribute('content', '#111318');
                }
            } catch (error) {}
        }());
    </script>
    <link rel="shortcut icon" href="${root}assets/img/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Inter:wght@400..800&amp;family=Space+Grotesk:wght@500..700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="${root}assets/css/fontawesome-all.min.css">
    <link rel="stylesheet" href="${root}assets/css/portfolio-home.css">
    <link rel="stylesheet" href="${root}assets/css/blog.css">
    <link rel="stylesheet" href="${root}assets/css/platform.css">
    <link rel="stylesheet" href="${root}assets/css/editorial.css">
    <link rel="stylesheet" href="${root}assets/css/news.css">
</head>
<body class="blog-page publication-page$body_class">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="blog-navbar platform-navbar editorial-nav">
        <div class="blog-navbar-inner">
            <a class="blog-brand" href="${root}"><strong>StackedByBayo</strong></a>
            <a class="news-search-link" href="${root}search/" aria-label="Search"><i class="fas fa-search" aria-hidden="true"></i></a>
            <button class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false"><i class="far fa-moon" aria-hidden="true"></i><span>Dark</span></button>
            <button class="publication-menu" type="button" aria-controls="site-navigation" aria-expanded="false" hidden><span>Menu</span><i class="fas fa-bars" aria-hidden="true"></i></button>
            <nav id="site-navigation" class="blog-nav-links" aria-label="Main navigation">$navigation</nav>
        </div>
    </header>
    <main id="main-content" tabindex="-1" class="$main_class">
        $content
    </main>
    $footer
    <script src="${root}assets/js/portfolio-home.js"></script>
    <script src="${root}assets/js/publication.js" defer></script>
</body>
</html>
